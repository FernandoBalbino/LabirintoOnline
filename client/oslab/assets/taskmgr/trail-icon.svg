<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ad8ff"/><stop offset=".5" stop-color="#2b78ff"/><stop offset="1" stop-color="#5b3fd8"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b3d"/><stop offset="1" stop-color="#132a5c"/></linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fe7ff"/><stop offset="1" stop-color="#9b8cff"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#e0362f"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1d4ed8" flood-opacity=".45"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".35"/></filter>
  </defs>
  <!-- janela do Gerenciador: barra lateral e gráfico de desempenho -->
  <g filter="url(#glow)">
    <rect x="22" y="38" width="196" height="160" rx="22" fill="url(#body)"/>
    <rect x="22" y="38" width="196" height="38" rx="22" fill="#fff" opacity=".22"/>
    <rect x="64" y="84" width="142" height="102" rx="12" fill="url(#screen)"/>
  </g>
  <g fill="#fff" opacity=".9"><rect x="34" y="90" width="20" height="6" rx="3"/><rect x="34" y="106" width="20" height="6" rx="3"/><rect x="34" y="122" width="20" height="6" rx="3"/><rect x="34" y="138" width="20" height="6" rx="3"/></g>
  <circle cx="40" cy="57" r="5" fill="#fff"/><circle cx="56" cy="57" r="5" fill="#fff" opacity=".7"/><circle cx="72" cy="57" r="5" fill="#fff" opacity=".45"/>
  <g stroke="#ffffff" stroke-opacity=".12" stroke-width="2"><path d="M64 110h142M64 136h142M64 162h142M100 84v102M136 84v102M172 84v102"/></g>
  <path d="M68 166 96 160 112 134 128 150 146 104 162 140 180 124 202 128" fill="none" stroke="url(#pulse)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M68 166 96 160 112 134 128 150 146 104 162 140 180 124 202 128V186H68z" fill="url(#pulse)" opacity=".18"/>
  <!-- selo: finalizar tarefa -->
  <g transform="translate(196 190)" filter="url(#soft)">
    <circle r="34" fill="url(#badge)"/>
    <circle r="34" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <circle r="15" fill="none" stroke="#fff" stroke-width="7"/>
    <path d="M-10 10 10 -10" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
