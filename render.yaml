# Servidor do jogo (somente WebSocket). O site fica no GitHub Pages.
services:
  - type: web
    name: labirinto-online
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ALLOWED_ORIGINS
        value: https://fernandobalbino.github.io
      - key: SERVE_STATIC
        value: "0"
      - key: PUBLIC_CLIENT_URL
        value: https://fernandobalbino.github.io/LabirintoOnline/
